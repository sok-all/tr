services:
  postgres:
    image: postgres:10
    ports:
      - "7000:7000"
    environment:
      POSTGRES_DB: 'postgres'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'DatabasePassword'

  gocalc:
    image: 3-36:latest
    environment:
      - POSTGRES_URI=postgres://user:DatabasePassword@postgres/postgres?sslmode=disable
      - LISTEN_ADDRESS=:7000
    restart: unless-stopped    
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    cap_add: ['chown', 'setgid', 'setuid']
    cap_drop: ['ALL']     
    depends_on:
      - gocalc

networks:
  gocalc-nj-net:
    driver: bridge
  gocalc-pg-net:
    driver: bridge


    
